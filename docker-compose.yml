name: prepquest

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prepquest
      POSTGRES_PASSWORD: prepquest
      POSTGRES_DB: prepquest
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepquest"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for hidden test data, uploads, resumes (Zenko CloudServer; MinIO's
  # community images are no longer published). Same API in production (S3/R2).
  s3:
    image: zenko/cloudserver:latest
    environment:
      SCALITY_ACCESS_KEY_ID: prepquest
      SCALITY_SECRET_ACCESS_KEY: prepquest-secret
      S3BACKEND: file
      REMOTE_MANAGEMENT_DISABLE: "1"
    ports: ["9000:8000"]
    volumes:
      - s3data:/usr/src/app/localData
      - s3meta:/usr/src/app/localMetadata

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # The real sandbox: isolate + g++/Python/JDK in a privileged Linux container (doc 12). Start it with
  #   docker compose --profile judge up -d --build judge
  # instead of `pnpm --filter @prepquest/judge dev` (which uses the unsandboxed process runner).
  # It reaches Redis by service name and reads hidden tests from the API's `.data/objects` (fs driver);
  # with STORAGE_DRIVER=s3 point it at the `s3` service instead.
  judge:
    profiles: ["judge"]
    build:
      context: .
      dockerfile: apps/judge/Dockerfile
    privileged: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      JUDGE_SANDBOX: isolate
      JUDGE_CGROUPS: "true"
      JUDGE_CONCURRENCY: "2"
      STORAGE_DRIVER: fs
      STORAGE_FS_DIR: /data/objects
    volumes:
      - ./.data/objects:/data/objects:ro

volumes:
  pgdata:
  s3data:
  s3meta:
